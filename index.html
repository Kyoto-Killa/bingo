<style>
/* Bingo Night stage - shared by the audience display and the caller preview.
   Sized in container units so it scales to any window. */

/* One color per letter: B blue, I red, N white, G green, O gold. */
.L-B{--hi:#8DBBFF;--c1:#2F6FE0;--c2:#123C99;--on:#fff;--ink:#2F6FE0}
.L-I{--hi:#FF8F95;--c1:#D6303F;--c2:#8A1520;--on:#fff;--ink:#D6303F}
.L-N{--hi:#fff;--c1:#F4F1EA;--c2:#B3BBCB;--on:#12213C;--ink:#12213C}
.L-G{--hi:#86E6A8;--c1:#2DAA66;--c2:#0E6338;--on:#fff;--ink:#1E8A50}
.L-O{--hi:#FFE48A;--c1:#F4C15D;--c2:#C98A12;--on:#3A2600;--ink:#C98A12}
.L-W{--hi:#fff;--c1:#F4F1EA;--c2:#B3BBCB;--on:#12213C;--ink:#12213C}

.stage-frame{
  --bg-deep:#0F1B33; --bg-panel:#16243F; --bg-panel-2:#1C2E4F;
  --red:#D6303F; --gold:#F4C15D; --cream:#FFF6E8; --chrome:#B9C4D0; --dim:#7E8CA6;
  position:relative;width:100%;height:100%;container-type:size;overflow:hidden;
  background:var(--bg-deep);color:var(--cream);font-family:"DM Sans",sans-serif;
}
.stage-frame *{box-sizing:border-box}
.st-hidden{display:none !important}

.st-stage{position:absolute;inset:0;display:flex;flex-direction:column;padding:3.8cqh 1.8cqw 0;gap:1.4cqh}

/* Header */
.st-header{position:relative;flex:0 0 auto;text-align:center}
.st-header h1{margin:0;font-family:"Bungee",cursive;font-weight:400;letter-spacing:3px;color:var(--gold);
  font-size:clamp(30px,5.6cqh,68px);text-shadow:0 0 16px rgba(244,193,93,.5),3px 3px 0 var(--red)}
.st-sub{margin-top:2px;font-family:"Anton",sans-serif;letter-spacing:5px;color:var(--chrome);text-transform:uppercase;font-size:clamp(12px,2cqh,22px)}
.st-bulbs{position:absolute;top:50%;left:0;right:0;display:flex;justify-content:space-between;transform:translateY(-50%);padding:0 4px}
.st-bulbs span{width:.9cqh;height:.9cqh;min-width:5px;min-height:5px;border-radius:50%;background:var(--gold);
  box-shadow:0 0 6px 2px rgba(244,193,93,.7);animation:st-twinkle 1.6s infinite ease-in-out}
.st-bulbs span:nth-child(odd){animation-delay:.4s}
@keyframes st-twinkle{0%,100%{opacity:.35}50%{opacity:1}}

/* Cards */
.st-hero{flex:1 1 0;min-height:0;display:flex;gap:1.4cqw}
.st-card{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;padding:1.2cqh 1.1cqw;
  background:var(--bg-panel);border:2px solid var(--bg-panel-2);border-radius:16px}
.st-ball-card{flex:1.5;align-items:center}
.st-label{font-family:"Anton",sans-serif;font-size:clamp(10px,1.4cqh,15px);letter-spacing:3px;text-transform:uppercase;
  color:var(--dim);text-align:center;margin-bottom:4px}

/* Ball */
.st-ball-body{flex:1;width:100%;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.6cqh}
.st-ball-slot{flex:1 1 0;width:100%;min-height:0;container-type:size;display:flex;align-items:center;justify-content:center}
.st-cam-slot{display:none;flex:1 1 0;width:100%;min-height:0;align-items:center;justify-content:center}
.st-ball-body.camera-on .st-ball-slot{flex:0 0 40%}
.st-ball-body.camera-on .st-cam-slot{display:flex}

.st-orbit{position:relative;width:min(96cqh,96cqw);height:min(96cqh,96cqw);display:flex;align-items:center;justify-content:center}
.st-ring{position:absolute;inset:0;border-radius:50%;border:2px dashed rgba(244,193,93,.35);animation:st-spin 18s linear infinite}
.st-ring2{inset:5%;border:1px dashed rgba(185,196,208,.25);animation:st-spin 24s linear infinite reverse}
@keyframes st-spin{to{transform:rotate(360deg)}}

.st-ball{position:relative;width:80%;height:80%;border-radius:50%;container-type:size;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at 32% 28%,var(--hi) 0,var(--c1) 38%,var(--c2) 100%);
  box-shadow:0 10px 26px rgba(0,0,0,.45),inset -5cqw -7cqw 10cqw rgba(0,0,0,.2)}
.st-ball::after{content:"";position:absolute;top:7%;left:15%;width:32%;height:16%;border-radius:50%;
  background:radial-gradient(ellipse,rgba(255,255,255,.7),rgba(255,255,255,0));transform:rotate(-28deg)}
.st-disc{width:66%;height:66%;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:radial-gradient(circle at 40% 30%,#fff,#EEE8DA);box-shadow:inset 0 0 0 1cqw rgba(0,0,0,.07),0 1cqw 3cqw rgba(0,0,0,.25)}
.st-disc-letter{font-family:"Anton",sans-serif;font-size:19cqw;line-height:1;color:var(--ink);letter-spacing:1px}
.st-disc-num{font-family:"Anton",sans-serif;font-size:36cqw;line-height:1;color:#12213C;letter-spacing:1px}
.st-wait{font-family:"Anton",sans-serif;font-size:12cqw;line-height:1.3;color:#1B2A45;letter-spacing:1px;text-align:center}
.st-ball.drop{animation:st-drop .8s cubic-bezier(.3,1.2,.5,1)}
@keyframes st-drop{
  0%{transform:translateY(-130%) rotate(-240deg) scale(.55);opacity:0}
  55%{transform:translateY(5%) rotate(12deg) scale(1.06);opacity:1}
  75%{transform:translateY(-3%) rotate(-4deg)}
  100%{transform:none}}

.st-cam-wrap{position:relative;width:96%;height:96%;border-radius:14px;overflow:hidden;background:#000;
  box-shadow:0 8px 20px rgba(0,0,0,.45),inset 0 0 0 3px var(--gold)}
.st-cam-wrap video{width:100%;height:100%;object-fit:cover}
.st-live{position:absolute;top:6%;left:5%;display:flex;align-items:center;gap:5px;background:var(--red);color:var(--cream);
  font-family:"Anton",sans-serif;letter-spacing:1px;font-size:clamp(10px,1.6cqh,14px);padding:3px 9px;border-radius:20px}
.st-live i{width:7px;height:7px;border-radius:50%;background:var(--cream);animation:st-twinkle 1s infinite}
.st-cam-caption{position:absolute;bottom:5%;left:50%;transform:translateX(-50%);background:rgba(15,27,51,.85);color:var(--gold);
  font-family:"Bungee",cursive;font-size:clamp(12px,2.1cqh,22px);padding:4px 16px;border-radius:20px;white-space:nowrap}

/* Pattern */
.st-pat-name{font-family:"Anton",sans-serif;text-align:center;color:var(--gold);letter-spacing:1px;font-size:clamp(14px,2.6cqh,30px);margin:2px 0 8px}
.st-grid{flex:1;min-height:0;align-self:center;aspect-ratio:1;max-width:100%;display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(5,1fr);gap:5px}
.st-cell{background:var(--bg-panel-2);border-radius:6px;display:flex;align-items:center;justify-content:center;
  font-family:"Anton",sans-serif;font-size:clamp(8px,1.3cqh,14px);color:var(--dim)}
.st-cell.hit{background:var(--red);color:var(--cream)}
.st-cell.free{background:var(--gold);color:var(--bg-deep)}

/* Tote board: all 75 numbers */
.st-tote{flex:0 0 26cqh;display:grid;grid-template-columns:3.2cqw repeat(15,1fr);grid-template-rows:repeat(5,1fr);gap:.7cqh .35cqw;
  padding:1.2cqh 1.1cqw;background:var(--bg-panel);border:2px solid var(--bg-panel-2);border-radius:16px}
.st-tl,.st-tc{display:flex;align-items:center;justify-content:center;min-height:0;font-family:"Anton",sans-serif}
.st-tl{margin:auto;height:100%;aspect-ratio:1;border-radius:50%;font-size:clamp(10px,2.8cqh,32px);
  background:radial-gradient(circle at 32% 28%,var(--hi),var(--c1) 40%,var(--c2));color:var(--on)}
.st-tc{border-radius:6px;background:var(--bg-panel-2);color:var(--dim);font-size:clamp(9px,2.4cqh,28px);letter-spacing:.5px}
.st-tc.called{background:var(--c1);color:var(--on)}
.st-tc.current{position:relative;z-index:2;animation:st-pulse 1s ease-in-out infinite;box-shadow:0 0 0 .35cqh var(--gold),0 0 1.6cqh var(--gold)}
@keyframes st-pulse{50%{transform:scale(1.16)}}

/* Footer */
.st-footer{flex:0 0 auto;margin:0 -1.8cqw}
.st-checker{height:5px;background-image:repeating-linear-gradient(90deg,var(--cream) 0 14px,var(--bg-deep) 14px 28px);opacity:.85}
.st-ticker{background:var(--red);overflow:hidden;white-space:nowrap;height:clamp(32px,5cqh,54px);display:flex;align-items:center;
  border-top:2px solid var(--gold);border-bottom:2px solid var(--gold)}
.st-track{display:inline-flex;align-items:center;white-space:nowrap;animation:st-scroll 40s linear infinite;
  font-family:"Anton",sans-serif;letter-spacing:1px;font-size:clamp(15px,2.6cqh,26px);color:var(--cream)}
.st-track span{padding:0 2.5cqw}
@keyframes st-scroll{to{transform:translateX(-50%)}}

/* Full-screen overlays */
.st-overlay{position:absolute;inset:0;z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:2.4cqh;text-align:center;padding:4cqh 6cqw;background:var(--bg-deep)}
.st-big{margin:0;font-family:"Bungee",cursive;font-weight:400;color:var(--gold);font-size:clamp(34px,9cqh,110px);
  text-shadow:0 0 18px rgba(244,193,93,.5),3px 3px 0 var(--red)}
.st-body{font-family:"DM Sans",sans-serif;color:var(--cream);font-size:clamp(15px,2.8cqh,30px);max-width:60cqw;line-height:1.6}
.st-ballrow{display:flex;gap:1.6cqw;justify-content:center}
.st-bb{width:12cqh;height:12cqh;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-family:"Anton",sans-serif;font-size:6.4cqh;color:var(--on);
  background:radial-gradient(circle at 32% 28%,var(--hi),var(--c1) 40%,var(--c2));box-shadow:0 10px 22px rgba(0,0,0,.4),inset -.8cqh -1.2cqh 1.8cqh rgba(0,0,0,.2)}
#bingoScreen{background:var(--red);overflow:hidden}
#bingoScreen .st-big{color:var(--cream);font-size:clamp(56px,16cqh,200px);text-shadow:0 0 24px rgba(255,255,255,.4),4px 4px 0 var(--gold);animation:st-bpulse 1s ease-in-out infinite}
#bingoScreen .st-bb{animation:st-bounce .9s ease-in-out infinite;animation-delay:calc(var(--i) * .12s)}
#bingoScreen .st-body{font-family:"Anton",sans-serif;letter-spacing:1px}
@keyframes st-bpulse{50%{transform:scale(1.06)}}
@keyframes st-bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-4cqh)}}
.st-confetti-wrap{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.st-confetti{position:absolute;top:-8%;width:10px;height:16px;opacity:.9;animation:st-fall linear infinite}
@keyframes st-fall{from{transform:translateY(-10cqh) rotate(0)}to{transform:translateY(115cqh) rotate(360deg)}}

@media (prefers-reduced-motion:reduce){
  .st-ring,.st-track,.st-tc.current,.st-bulbs span,#bingoScreen .st-bb,#bingoScreen .st-big{animation:none}
}

html,body{margin:0;width:100%;height:100%;background:#0F1B33;overflow:hidden;overscroll-behavior:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
#stageHost{position:fixed;top:env(safe-area-inset-top,0px);right:env(safe-area-inset-right,0px);bottom:env(safe-area-inset-bottom,0px);left:env(safe-area-inset-left,0px)}
/* On a phone the tote board is also the keypad, so give it more height. */
@container (max-height:560px){
  .st-stage{display:grid;grid-template-columns:minmax(0,1fr) 36cqw;grid-template-rows:minmax(0,1fr) auto;
    grid-template-areas:"hero tote" "foot foot";gap:1.6cqh 1.4cqw;padding:4.4cqh 1.6cqw 0}
  .st-header{display:none}
  .st-hero{grid-area:hero}
  .st-tote{grid-area:tote;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(16,1fr);grid-auto-flow:column;gap:.5cqh .6cqw;padding:1.2cqh .8cqw}
  .st-footer{grid-area:foot;margin:0 -1.6cqw}
  .st-ticker{height:clamp(22px,7cqh,32px)}
  .st-tc,.st-tl{font-size:clamp(10px,3.6cqh,20px)}
  .st-card:not(.st-ball-card){justify-content:center}
  .st-grid{flex:0 0 auto;width:100%}
}
.st-tc{cursor:pointer}

#gear{position:fixed;top:calc(env(safe-area-inset-top,0px) + 6px);left:calc(env(safe-area-inset-left,0px) + 10px);z-index:500;
  width:44px;height:44px;border:0;border-radius:50%;background:transparent;color:#FFF6E8;opacity:.22;display:flex;align-items:center;justify-content:center}
#gear:active,#gear.show{opacity:.9}
#gear svg{width:24px;height:24px}

#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 14%);transform:translate(-50%,20px);z-index:450;opacity:0;pointer-events:none;
  display:flex;align-items:center;gap:12px;background:#1C2E4F;color:#FFF6E8;border:2px solid #F4C15D;border-radius:40px;padding:8px 8px 8px 18px;
  font:700 15px "DM Sans",sans-serif;transition:opacity .2s,transform .2s;white-space:nowrap}
#toast.on{opacity:1;pointer-events:auto;transform:translate(-50%,0)}
#toast button{font:400 14px "Anton",sans-serif;letter-spacing:1px;color:#0F1B33;background:#F4C15D;border:0;border-radius:30px;padding:8px 16px}

#menu{position:fixed;left:0;right:0;bottom:0;z-index:600;max-height:84%;overflow-y:auto;background:#16243F;border-top:3px solid #F4C15D;
  border-radius:18px 18px 0 0;padding:14px calc(env(safe-area-inset-right,0px) + 18px) calc(env(safe-area-inset-bottom,0px) + 18px) calc(env(safe-area-inset-left,0px) + 18px);
  transform:translateY(105%);transition:transform .25s ease;color:#FFF6E8;font-family:"DM Sans",sans-serif;-webkit-user-select:auto;user-select:auto}
#menu.open{transform:none}
#menu h3{margin:14px 0 8px;font:400 12px "Anton",sans-serif;letter-spacing:2px;text-transform:uppercase;color:#7E8CA6}
#menu .top{display:flex;justify-content:space-between;align-items:center}
#menu .top b{font:400 18px "Bungee",cursive;color:#F4C15D;letter-spacing:1px}
.m-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.m-btn{font:400 15px "Anton",sans-serif;letter-spacing:.5px;color:#FFF6E8;background:#1C2E4F;border:1px solid #2a3d61;border-radius:10px;padding:13px 8px}
.m-btn.on{background:rgba(244,193,93,.18);color:#F4C15D;border-color:#F4C15D}
.m-btn.red{background:#D6303F;border:0;box-shadow:0 4px 0 #9c1f2b}
.m-btn.red.on{background:#F4C15D;color:#0F1B33;box-shadow:0 4px 0 #b88a2e}
.m-pats{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.m-pat{display:flex;flex-direction:column;align-items:center;gap:6px;padding:9px 4px;background:#1C2E4F;color:#FFF6E8;border:1px solid #2a3d61;border-radius:10px;
  font:700 11px/1.15 "DM Sans",sans-serif}
.m-pat.on{background:rgba(244,193,93,.18);border-color:#F4C15D;color:#F4C15D}
.m-pat .th{display:grid;grid-template-columns:repeat(5,9px);gap:2px}
.m-pat .th i{width:9px;height:9px;border-radius:2px;background:#2a3d61}
.m-pat .th i.h{background:#D6303F}.m-pat .th i.f{background:#F4C15D}
.m-fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px}
.m-fields label{display:block;font:700 11px "DM Sans",sans-serif;color:#7E8CA6;margin-bottom:4px}
.m-fields input{width:100%;font:500 16px "DM Sans",sans-serif;color:#FFF6E8;background:#1C2E4F;border:1px solid #2a3d61;border-radius:8px;padding:10px}
.m-note{font-size:12px;color:#7E8CA6;line-height:1.5;margin:8px 0 0}

/* Birthday touches: bunting along the top and soft falling sprinkles */
.st-bunt{position:absolute;top:0;left:0;right:0;height:3.6cqh;z-index:250;pointer-events:none;display:flex;justify-content:space-between;padding:.4cqh 1cqw 0}
.st-bunt::before{content:"";position:absolute;left:0;right:0;top:.4cqh;height:2px;background:rgba(255,246,232,.55)}
.st-bunt i{position:relative;width:0;height:0;border-left:1.1cqh solid transparent;border-right:1.1cqh solid transparent;border-top:2.5cqh solid #fff}
.st-sprinkles{position:absolute;inset:0;overflow:hidden;pointer-events:none;opacity:.45}
.st-sprinkles .st-confetti{width:.9cqh;height:1.6cqh}
</style>
</head>
<body>
<div id="stageHost"><div class="stage-frame" id="stageRoot"></div></div>

<button id="gear" aria-label="Menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
<div id="toast"><span id="toastText"></span><button id="toastUndo">UNDO</button></div>

<div id="menu" role="dialog" aria-label="Bingo controls">
  <div class="top"><b>Bingo Controls</b><button class="m-btn" id="mClose" style="padding:9px 18px">Done</button></div>

  <h3>Audience screen</h3>
  <div class="m-grid">
    <button class="m-btn" data-screen="intro">Starting soon</button>
    <button class="m-btn" data-screen="game">Game board</button>
    <button class="m-btn" data-screen="brb">Be right back</button>
    <button class="m-btn red" data-screen="bingo">BINGO!</button>
  </div>
  <p class="m-note">On the game board, tap any number on the bottom board to call it. Made a mistake? Tap UNDO on the pop-up, or below.</p>

  <h3>Game</h3>
  <div class="m-grid">
    <button class="m-btn" id="mUndo">Undo last ball</button>
    <button class="m-btn" id="mReset">Reset game</button>
  </div>

  <h3>Pattern</h3>
  <div class="m-pats" id="mPats"></div>

  <h3>Text &amp; ticker</h3>
  <div class="m-fields">
    <div><label>Title</label><input id="fTitle" type="text"></div>
    <div><label>Subtitle</label><input id="fSubtitle" type="text"></div>
    <div><label>Starting soon message</label><input id="fIntro" type="text"></div>
    <div><label>Be right back message</label><input id="fBrb" type="text"></div>
    <div><label>BINGO! message</label><input id="fBingo" type="text"></div>
    <div><label>Scrolling ticker (comma-separated)</label><input id="fTicker" type="text"></div>
  </div>
  <button class="m-btn" id="mSaveText" style="width:100%;margin-top:10px">Update audience display</button>
</div>

<script>window.SHOW_LIVE_CAMERA = false;</script>
<script>
/*
  Shared stage renderer. Both caller.html (small live preview) and
  audience.html (the real full-screen display) include this file plus
  stage.css, and provide an empty <div class="stage-frame" id="stageRoot">.
  The stage markup is built here once, so it exists in a single place.

  Python is the single source of truth: it calls window.applyState(state)
  in both windows every time something changes.

  window.SHOW_LIVE_CAMERA = true (audience.html) makes that window request
  the camera. The caller preview sets it to false and just shows a label,
  so only one camera permission prompt appears.
*/

var LETTERS = ['B', 'I', 'N', 'G', 'O'];
var _cameraStream = null;
var _cameraStreamDeviceId; // deviceId the current stream was opened with
var _lastBall = null;
var _tickerBuilt = null;

function $(id){ return document.getElementById(id); }

function letterFor(n){
  if (n <= 15) return 'B';
  if (n <= 30) return 'I';
  if (n <= 45) return 'N';
  if (n <= 60) return 'G';
  return 'O';
}

function ballRow(){
  return LETTERS.map(function(l, i){
    return '<div class="st-bb L-' + l + '" style="--i:' + i + '">' + l + '</div>';
  }).join('');
}

function buildStage(){
  var root = $('stageRoot');
  if (!root) return;

  var bulbs = ''; for (var b = 0; b < 15; b++) bulbs += '<span></span>';

  root.innerHTML =
    '<div class="st-sprinkles"></div><div class="st-bunt" id="bunt"></div>' +
    '<div class="st-stage">' +
      '<div class="st-header"><div class="st-bulbs">' + bulbs + '</div><h1 id="headerTitle"></h1><div class="st-sub" id="headerSub"></div></div>' +
      '<div class="st-hero">' +
        '<div class="st-card st-ball-card"><div class="st-label">Current Ball</div>' +
          '<div class="st-ball-body" id="ballCardBody">' +
            '<div class="st-ball-slot"><div class="st-orbit"><div class="st-ring"></div><div class="st-ring st-ring2"></div>' +
              '<div class="st-ball L-W" id="ballEl"><div class="st-disc" id="ballContent"></div></div></div></div>' +
            '<div class="st-cam-slot"><div class="st-cam-wrap" id="cameraWrap">' +
              '<video id="cameraVideo" autoplay playsinline muted></video>' +
              '<div class="st-live"><i></i>LIVE</div><div class="st-cam-caption st-hidden" id="cameraCaption"></div>' +
            '</div></div>' +
          '</div></div>' +
        '<div class="st-card"><div class="st-label">Pattern</div>' +
          '<div class="st-pat-name" id="patternName"></div><div class="st-grid" id="miniGrid"></div></div>' +
      '</div>' +
      '<div class="st-tote" id="tote"></div>' +
      '<div class="st-footer"><div class="st-checker"></div><div class="st-ticker"><div class="st-track" id="tickerTrack"></div></div></div>' +
    '</div>' +
    '<div class="st-overlay st-hidden" id="introScreen"><div class="st-sprinkles"></div>' +
      '<div class="st-ballrow">' + ballRow() + '</div>' +
      '<h1 class="st-big">Starting Soon</h1><div class="st-body" id="introBody"></div></div>' +
    '<div class="st-overlay st-hidden" id="brbScreen"><div class="st-sprinkles"></div>' +
      '<h1 class="st-big">Be Right Back</h1><div class="st-body" id="brbBody"></div></div>' +
    '<div class="st-overlay st-hidden" id="bingoScreen">' +
      '<div class="st-confetti-wrap" id="confetti"></div>' +
      '<div class="st-ballrow">' + ballRow() + '</div>' +
      '<h1 class="st-big">BINGO!</h1><div class="st-body" id="bingoBody"></div></div>';

  // Tote board: one row per letter, 15 numbers each.
  var tote = $('tote');
  LETTERS.forEach(function(l, r){
    var label = document.createElement('div');
    label.className = 'st-tl L-' + l;
    label.textContent = l;
    tote.appendChild(label);
    for (var i = 1; i <= 15; i++){
      var n = r * 15 + i;
      var cell = document.createElement('div');
      cell.className = 'st-tc L-' + l;
      cell.id = 'tc-' + n;
      cell.textContent = n;
      tote.appendChild(cell);
    }
  });

  // Confetti in the ball colors.
  var colors = ['#F4C15D', '#FFF6E8', '#B9C4D0', '#F4C15D', '#FFF6E8'];
  var wrap = $('confetti');
  for (var c = 0; c < 44; c++){
    var p = document.createElement('div');
    p.className = 'st-confetti';
    p.style.cssText = 'left:' + (Math.random() * 100) + '%;background:' + colors[c % 5] +
      ';animation-duration:' + (2.6 + Math.random() * 2) + 's;animation-delay:' + (Math.random() * 2) + 's';
    wrap.appendChild(p);
  }

  // Birthday bunting along the top, plus soft sprinkles behind everything.
  var bc = ['#D6303F', '#F4C15D', '#2F6FE0', '#2DAA66', '#FFF6E8'];
  var bunt = $('bunt');
  for (var q = 0; q < 26; q++){
    var flag = document.createElement('i');
    flag.style.borderTopColor = bc[q % 5];
    bunt.appendChild(flag);
  }
  Array.prototype.forEach.call(document.querySelectorAll('.st-sprinkles'), function(w){
    for (var z = 0; z < 16; z++){
      var sp = document.createElement('div');
      sp.className = 'st-confetti';
      sp.style.cssText = 'left:' + (Math.random() * 100) + '%;background:' + bc[z % 5] +
        ';animation-duration:' + (7 + Math.random() * 6) + 's;animation-delay:-' + (Math.random() * 10) + 's';
      w.appendChild(sp);
    }
  });
}

function renderScreens(state){
  var intro = $('introScreen');
  if (!intro) return;
  intro.classList.toggle('st-hidden', state.screen !== 'intro');
  $('brbScreen').classList.toggle('st-hidden', state.screen !== 'brb');
  $('bingoScreen').classList.toggle('st-hidden', state.screen !== 'bingo');
}

function stopCameraStream(){
  if (_cameraStream) _cameraStream.getTracks().forEach(function(t){ t.stop(); });
  _cameraStream = null;
  _cameraStreamDeviceId = undefined;
}

async function ensureCameraStream(deviceId){
  if (_cameraStream && _cameraStreamDeviceId === deviceId) return _cameraStream;
  stopCameraStream();
  var constraints = { audio: false, video: deviceId ? { deviceId: { exact: deviceId } } : true };
  try{
    _cameraStream = await navigator.mediaDevices.getUserMedia(constraints);
    _cameraStreamDeviceId = deviceId;
  }catch(err){
    _cameraStream = null;
    _cameraStreamDeviceId = undefined;
  }
  return _cameraStream;
}

async function renderCamera(state){
  var bodyEl = $('ballCardBody');
  var caption = $('cameraCaption');
  if (!bodyEl || !$('cameraWrap')) return;

  bodyEl.classList.toggle('camera-on', !!state.cameraMode);

  if (!state.cameraMode){
    if (window.SHOW_LIVE_CAMERA) stopCameraStream();
    return;
  }
  if (window.SHOW_LIVE_CAMERA){
    var videoEl = $('cameraVideo');
    var stream = await ensureCameraStream(state.cameraDeviceId || undefined);
    if (stream){
      if (videoEl.srcObject !== stream) videoEl.srcObject = stream;
      caption.classList.add('st-hidden');
    } else {
      caption.textContent = 'Camera unavailable';
      caption.classList.remove('st-hidden');
    }
  } else {
    caption.textContent = 'Live on audience display';
    caption.classList.remove('st-hidden');
  }
}

function renderBall(state){
  var content = $('ballContent');
  var ballEl = $('ballEl');
  if (!content) return;

  if (state.current === null){
    ballEl.className = 'st-ball L-W';
    content.innerHTML = '<div class="st-wait">Let\u2019s<br>play!</div>';
  } else {
    var l = letterFor(state.current);
    ballEl.className = 'st-ball L-' + l;
    content.innerHTML = '<div class="st-disc-letter">' + l + '</div><div class="st-disc-num">' + state.current + '</div>';
    if (state.current !== _lastBall){
      void ballEl.offsetWidth; // restart the drop animation
      ballEl.classList.add('drop');
    }
  }
  _lastBall = state.current;
}

function renderPattern(state){
  var nameEl = $('patternName');
  var grid = $('miniGrid');
  if (!nameEl || !grid) return;
  nameEl.textContent = state.patternName;
  var cells = state.patternCells || [];
  grid.innerHTML = '';
  for (var i = 0; i < 25; i++){
    var cell = document.createElement('div');
    cell.className = 'st-cell';
    if (cells.indexOf(i) !== -1) cell.classList.add('hit');
    if (i === 12){ cell.classList.add('free'); cell.textContent = 'FREE'; }
    grid.appendChild(cell);
  }
}

function renderTote(state){
  var called = {};
  (state.called || []).forEach(function(n){ called[n] = true; });
  for (var n = 1; n <= 75; n++){
    var cell = $('tc-' + n);
    if (!cell) return;
    cell.className = 'st-tc L-' + letterFor(n) + (called[n] ? ' called' : '') + (n === state.current ? ' current' : '');
  }
}

function renderTicker(state){
  var track = $('tickerTrack');
  if (!track) return;
  var items = state.ticker || [];
  var key = items.join('|');
  if (_tickerBuilt === key) return;
  track.innerHTML = '';
  items.concat(items).forEach(function(t){
    var s = document.createElement('span');
    s.textContent = t;
    track.appendChild(s);
  });
  _tickerBuilt = key;
}

function renderTexts(state){
  var t = state.texts || {};
  var map = {
    headerTitle: t.title, headerSub: t.subtitle,
    introBody: t.introBody, brbBody: t.brbBody, bingoBody: t.bingoBody
  };
  Object.keys(map).forEach(function(id){
    var el = $(id);
    if (el && map[id] !== undefined) el.textContent = map[id];
  });
}

window.applyState = function(state){
  renderScreens(state);
  renderBall(state);
  renderPattern(state);
  renderTote(state);
  renderTicker(state);
  renderTexts(state);
  renderCamera(state);
};

buildStage();

</script>
<script>
(function(){
  'use strict';

  /* ---------- patterns (cells 0-24, row by row; 12 is FREE) ---------- */
  function cells(){
    var seen = {}, out = [];
    for (var i = 0; i < arguments.length; i++) arguments[i].forEach(function(c){ if (!seen[c]){ seen[c] = 1; out.push(c); } });
    return out.sort(function(a, b){ return a - b; });
  }
  var ROWS = [], COLS = [], r;
  for (r = 0; r < 5; r++){
    ROWS.push([0,1,2,3,4].map(function(i){ return r * 5 + i; }));
    COLS.push([0,1,2,3,4].map(function(i){ return r + 5 * i; }));
  }
  var DIAGS = [[0,6,12,18,24],[4,8,12,16,20]];
  var CYCLING = {
    regular: ROWS.concat(COLS, DIAGS),
    horizontal: ROWS,
    vertical: COLS,
    diagonal: DIAGS,
    railroad: [0,1,2,3].map(function(i){ return cells(ROWS[i], ROWS[i+1]); })
      .concat([0,1,2,3].map(function(i){ return cells(COLS[i], COLS[i+1]); }))
  };
  var FIXED = {
    x: cells(DIAGS[0], DIAGS[1]),
    plus: cells(ROWS[2], COLS[2]),
    c: cells(ROWS[0], COLS[0], ROWS[4]),
    picnic: cells(ROWS[0], DIAGS[0], DIAGS[1]),
    layer_cake: cells(ROWS[0], ROWS[2], ROWS[4]),
    frame: [6,7,8,11,13,16,17,18],
    big_frame: [0,1,2,3,4,5,9,10,14,15,19,20,21,22,23,24],
    coverall: (function(){ var a = []; for (var i = 0; i < 25; i++) a.push(i); return a; })()
  };
  var PATTERNS = [
    ['regular','Any Line'],['horizontal','Horizontal Line'],['vertical','Vertical Line'],['diagonal','Diagonal Line'],
    ['railroad','Railroad Tracks'],['x','Letter X'],['plus','Plus Sign'],['c','Letter C'],['picnic','Picnic Table'],
    ['layer_cake','Layer Cake'],['frame','Picture Frame'],['big_frame','Large Picture Frame'],['coverall','Coverall']
  ];
  var NAMES = {};
  PATTERNS.forEach(function(p){ NAMES[p[0]] = p[1]; });

  /* ---------- state (saved on the phone so a refresh never loses the game) ---------- */
  var KEY = 'bingo-night-v1';
  var S = {
    called: [], current: null, pattern: 'regular', screen: 'intro', cycle: 0,
    texts: {
      title: 'Bingo Night', subtitle: 'Live at Culver\u2019s \u00b7 Every Monday',
      introBody: 'Make sure you grab a card!', brbBody: 'We\u2019ll be back in just a moment.',
      bingoBody: 'Come on up to verify your card'
    },
    ticker: [
      'Fresh ButterBurgers hot off the grill', 'Frozen Custard churned fresh all day',
      'Ask your server about the Flavor of the Day', 'Wisconsin Cheese Curds \u2014 golden and hot',
      'Concrete Mixers loaded with your favorite mix-ins', 'Tell your table to grab a Value Basket',
      'Root Beer Floats made the classic way', 'Thanks for playing Bingo Night with us'
    ]
  };
  try{
    var saved = JSON.parse(localStorage.getItem(KEY) || 'null');
    if (saved && Array.isArray(saved.called)){
      Object.keys(S).forEach(function(k){ if (saved[k] !== undefined) S[k] = saved[k]; });
      if (!NAMES[S.pattern]) S.pattern = 'regular';
    }
  }catch(e){}
  function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

  function shape(){
    var c = CYCLING[S.pattern];
    return c ? c[S.cycle % c.length] : FIXED[S.pattern];
  }
  function render(){
    window.applyState({
      called: S.called, current: S.current, pattern: S.pattern, patternName: NAMES[S.pattern],
      patternCells: shape(), screen: S.screen, cameraMode: false, texts: S.texts, ticker: S.ticker
    });
    syncMenu();
  }
  function commit(){ save(); render(); }

  /* ---------- actions ---------- */
  var toastTimer;
  function toast(msg){
    $('toastText').textContent = msg;
    $('toast').classList.add('on');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ $('toast').classList.remove('on'); }, 4500);
  }
  function callBall(n){
    if (n < 1 || n > 75 || S.called.indexOf(n) !== -1) return;
    S.called.push(n); S.current = n;
    commit();
    toast('Called ' + letterFor(n) + '-' + n);
  }
  function undo(){
    if (!S.called.length) return;
    S.called.pop();
    S.current = S.called.length ? S.called[S.called.length - 1] : null;
    commit();
    $('toast').classList.remove('on');
  }
  function reset(){ S.called = []; S.current = null; commit(); }
  function setScreen(name){ S.screen = (S.screen === name && name !== 'intro' && name !== 'game') ? 'game' : name; commit(); }

  /* ---------- tote board is the keypad ---------- */
  $('tote').addEventListener('click', function(e){
    var el = e.target.closest ? e.target.closest('.st-tc') : null;
    if (el) callBall(parseInt(el.id.slice(3), 10));
  });
  $('toastUndo').addEventListener('click', undo);

  /* ---------- menu ---------- */
  var menu = $('menu');
  function openMenu(open){
    menu.classList.toggle('open', open);
    $('gear').classList.toggle('show', open);
    if (open) fillFields();
  }
  $('gear').addEventListener('click', function(){ openMenu(!menu.classList.contains('open')); });
  $('mClose').addEventListener('click', function(){ openMenu(false); });

  Array.prototype.forEach.call(menu.querySelectorAll('[data-screen]'), function(b){
    b.addEventListener('click', function(){ setScreen(b.getAttribute('data-screen')); });
  });
  $('mUndo').addEventListener('click', undo);
  var rb = $('mReset');
  rb.addEventListener('click', function(){
    if (rb.dataset.c !== '1'){
      rb.dataset.c = '1'; rb.textContent = 'Tap again to confirm';
      setTimeout(function(){ rb.dataset.c = '0'; rb.textContent = 'Reset game'; }, 2500);
      return;
    }
    rb.dataset.c = '0'; rb.textContent = 'Reset game'; reset();
  });

  PATTERNS.forEach(function(p){
    var b = document.createElement('button');
    b.className = 'm-pat'; b.dataset.key = p[0];
    var first = CYCLING[p[0]] ? CYCLING[p[0]][0] : FIXED[p[0]], th = '<div class="th">';
    for (var i = 0; i < 25; i++) th += '<i class="' + (first.indexOf(i) !== -1 ? 'h' : (i === 12 ? 'f' : '')) + '"></i>';
    b.innerHTML = th + '</div><span></span>';
    b.lastChild.textContent = p[1];
    b.addEventListener('click', function(){ S.pattern = p[0]; S.cycle = 0; commit(); });
    $('mPats').appendChild(b);
  });

  function syncMenu(){
    Array.prototype.forEach.call(menu.querySelectorAll('[data-screen]'), function(b){
      b.classList.toggle('on', b.getAttribute('data-screen') === S.screen);
    });
    Array.prototype.forEach.call($('mPats').children, function(b){ b.classList.toggle('on', b.dataset.key === S.pattern); });
  }

  var FIELDS = { fTitle: 'title', fSubtitle: 'subtitle', fIntro: 'introBody', fBrb: 'brbBody', fBingo: 'bingoBody' };
  function fillFields(){
    Object.keys(FIELDS).forEach(function(id){ $(id).value = S.texts[FIELDS[id]]; });
    $('fTicker').value = S.ticker.join(', ');
  }
  $('mSaveText').addEventListener('click', function(){
    Object.keys(FIELDS).forEach(function(id){
      var v = $(id).value.trim();
      if (v) S.texts[FIELDS[id]] = v;
    });
    var items = $('fTicker').value.split(',').map(function(s){ return s.trim(); }).filter(Boolean);
    if (items.length) S.ticker = items;
    commit();
    this.textContent = 'Updated \u2713';
    var btn = this; setTimeout(function(){ btn.textContent = 'Update audience display'; }, 1500);
  });

  /* ---------- cycling patterns + keep the screen awake ---------- */
  setInterval(function(){
    var c = CYCLING[S.pattern];
    if (c && c.length > 1){ S.cycle = (S.cycle + 1) % c.length; render(); }
  }, 2200);

  function wake(){ try{ if (navigator.wakeLock) navigator.wakeLock.request('screen').catch(function(){}); }catch(e){} }
  document.addEventListener('touchstart', wake, { once: true });
  document.addEventListener('visibilitychange', function(){ if (!document.hidden) wake(); });

  render();
})();
</script>
</body>
